<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifikasi Kartu Hasil — ProctorCBT</title>
  <meta name="theme-color" content="#1B4332">
  <meta name="robots" content="noindex">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400..500,0..1,0&icon_names=cancel,error,hourglass_top,verified,verified_user&display=block">
  <link rel="stylesheet" href="./css/style.css?v=1.0.0">
  <style>
    body { background: var(--canvas); }
    .vwrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .vcard { width: 100%; max-width: 460px; background: #fff; border-radius: 28px; box-shadow: var(--sh-3); overflow: hidden; }
    .vtop { background: var(--forest); color: #fff; padding: 22px 24px; display: flex; align-items: center; gap: 12px; }
    .vbody { padding: 24px; }
    .vstat { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; font-weight: 700; }
    .vstat .ms { font-size: 30px; width: auto; }
    .vok { background: var(--ok-bg); color: var(--ok); } .vbad { background: var(--bad-bg); color: var(--bad); } .vwait { background: var(--s-low); color: var(--outline); }
    .vrow { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .vrow span { color: var(--outline); } .vrow b { text-align: right; }
    .vnilai { margin-top: 18px; text-align: center; background: var(--canvas); border-radius: 20px; padding: 18px; }
    .vnilai b { display: block; font: 800 44px/1.1 var(--f-head); color: var(--forest-deep); }
  </style>
</head>
<body>
  <main class="vwrap">
    <section class="vcard" aria-live="polite">
      <div class="vtop"><div class="brand-mark"><span class="ms fill" aria-hidden="true">verified_user</span></div><div><div class="brand-name" style="color:#fff">ProctorCBT</div><div class="brand-sub" id="inst" style="color:var(--gold-soft)">Verifikasi Kartu Hasil Ujian</div></div></div>
      <div class="vbody" id="out"><div class="vstat vwait"><span class="ms" aria-hidden="true">hourglass_top</span><span>Memeriksa keaslian kartu…</span></div></div>
    </section>
  </main>
  <script src="./js/config.js"></script>
  <script src="./js/core.js?v=1.0.0"></script>
  <script>
    (async function () {
      const P = window.PCBT, out = document.getElementById('out'), q = new URLSearchParams(location.search);
      const id = q.get('id') || '', s = q.get('s') || '';
      function tampil(html) { out.innerHTML = html; }
      if (!id || !s) return tampil('<div class="vstat vbad"><span class="ms" aria-hidden="true">error</span><span>Tautan verifikasi tidak lengkap. Pindai ulang kode QR pada kartu.</span></div>');
      const r = await P.api('pub.verify', { id: id, s: s }, { noAuth: true });
      if (!r.success) return tampil('<div class="vstat vbad"><span class="ms" aria-hidden="true">error</span><span>' + P.esc(r.message) + '</span></div>');
      const d = r.data;
      if (!d.valid) return tampil('<div class="vstat vbad"><span class="ms" aria-hidden="true">cancel</span><span>TIDAK VALID — data kartu tidak cocok dengan server. Kartu mungkin diubah atau nilai telah dikoreksi ulang.</span></div>');
      document.getElementById('inst').textContent = d.institusi || 'Verifikasi Kartu Hasil Ujian';
      tampil('<div class="vstat vok"><span class="ms fill" aria-hidden="true">verified</span><span>ASLI — kartu sesuai data resmi server</span></div>' +
        [['Nama', d.nama], ['NIS/NISN', d.nis], ['Kelas', d.kelas], ['Ujian', d.ujian], ['Mata pelajaran', d.mapel], ['Status', d.status], ['Waktu selesai', d.waktu ? P.fmtTgl(d.waktu) + ' WIB' : '-']]
          .map(function (x) { return '<div class="vrow"><span>' + x[0] + '</span><b>' + P.esc(x[1] || '-') + '</b></div>'; }).join('') +
        '<div class="vnilai"><span class="label">Nilai Akhir</span><b>' + (d.nilai === null || d.nilai === '' ? '—' : P.esc(P.fmtNum(d.nilai))) + '</b></div>' +
        '<p class="tiny muted" style="text-align:center;margin-top:14px">Diverifikasi ' + P.fmtTgl(P.serverNow()) + ' WIB</p>');
    })();
  </script>
</body>
</html>
